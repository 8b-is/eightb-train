[project]
name = "eightb-train"
version = "0.1.0"
description = "Sovereign 8B-SOTA hybrid (language-vision-voice) training pipeline: QLoRA SFT over the PeetPedro datasets, then exact p/q ternary weight-deck sealing (64B@0x62)."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "torch>=2.4",
  "transformers>=4.44",
  "datasets>=2.20",
  "accelerate>=0.34",
  "peft>=0.12",
  "trl>=0.12",
  "bitsandbytes>=0.43 ; sys_platform == 'linux'",
  "safetensors>=0.4",
  "huggingface_hub>=0.24",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# script collection, not an installable package
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
